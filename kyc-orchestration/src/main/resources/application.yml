server:
  port: 8086

internal:
  api:
    key: ${INTERNAL_API_KEY:dev-internal-kyc-key-change-in-prod}

orchestration:
  screening:
    mock-enabled: ${SCREENING_MOCK:false}
  risk:
    mock-enabled: ${RISK_MOCK:false}

spring:
  application:
    name: kyc-orchestration
  datasource:
    url: ${DB_URL:jdbc:h2:mem:kycorchestrationdb}
    driverClassName: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none          # schema owned by schema.sql — never let Hibernate modify tables
  sql:
    init:
      mode: always            # run schema.sql on every startup (H2 in-memory safe)
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: ${H2_CONSOLE:true}

hashids:
  # Override via HASHIDS_SALT env var in production — never commit the real value
  salt: ${HASHIDS_SALT:kyc-dev-salt-change-in-prod}
  min-length: 8

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    path: /swagger-ui.html          # redirect: /swagger-ui.html → /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true  # show response time in the UI
    try-it-out-enabled: true        # enable "Try it out" by default
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.venus.kyc.orchestration.controller

