spring.application.name=risk-service

# Internal service-to-service authentication key (must match viewer)
internal.api.key=${INTERNAL_API_KEY:dev-internal-kyc-key-change-in-prod}
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:h2:mem:riskdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.sql.init.mode=always
spring.sql.init.platform=h2

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.hostname=${HOSTNAME:localhost}

# SFTP Configuration
sftp.host=${SFTP_HOST:localhost}
sftp.port=${SFTP_PORT:22}
sftp.user=${SFTP_USER:user}
sftp.password=${SFTP_PASSWORD:password}
sftp.enabled=${SFTP_ENABLED:false}
batch.work.dir=${BATCH_WORK_DIR:/tmp/risk-batch}
batch.sftp.upload.dir=upload

# ── CRRE (Client Risk Rating Engine) API ──────────────────────────────────────
crre.base-url=${CRRE_BASE_URL:https://crre-api.example.com}
crre.caller-system=${CRRE_CALLER_SYSTEM:KYC-SERVICE}
crre.crrm-version=${CRRE_CRRM_VERSION:2.0}
crre.http-timeout-ms=${CRRE_HTTP_TIMEOUT_MS:30000}
# true = MockRiskProvider (default, no CRRE connectivity needed)
# false = CrreRiskProvider (real CRRE API with mTLS)
crre.mock=${CRRE_MOCK:true}

# ── mTLS — Client identity (certificate we present to CRRE server) ────────────
crre.mtls.enabled=${CRRE_MTLS_ENABLED:false}
crre.mtls.key-store-path=${CRRE_KEY_STORE_PATH:}
crre.mtls.key-store-password=${CRRE_KEY_STORE_PASSWORD:}
crre.mtls.key-store-type=${CRRE_KEY_STORE_TYPE:PKCS12}

# ── mTLS — Server trust (leave blank to use JVM default cacerts) ─────────────
# Only set if CRRE uses a private/internal CA not in the JVM truststore
crre.mtls.trust-store-path=${CRRE_TRUST_STORE_PATH:}
crre.mtls.trust-store-password=${CRRE_TRUST_STORE_PASSWORD:}
crre.mtls.trust-store-type=${CRRE_TRUST_STORE_TYPE:PKCS12}
