spring.application.name=screening-service

# Internal service-to-service authentication key (must match viewer)
internal.api.key=${INTERNAL_API_KEY:dev-internal-kyc-key-change-in-prod}
server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:h2:mem:screeningdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=${H2_CONSOLE:true}

eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.hostname=${HOSTNAME:localhost}

# Batch Screening Configuration
batch.work.dir=${BATCH_WORK_DIR:batch-work}
batch.sftp.upload.dir=upload
batch.sftp.download.dir=download
batch.publicKeyPath=${GPG_PUBLIC_KEY_PATH:batch-work/pubring.gpg}
batch.privateKeyPath=${GPG_PRIVATE_KEY_PATH:batch-work/secring.gpg}
batch.passphrase=${GPG_PASSPHRASE:password}

# Storage mode: 'local' = local disk (dev default, no SFTP needed)
#               'sftp'  = real SFTP server (staging / prod)
# Override with env var: STORAGE_MODE=sftp
storage.mode=${STORAGE_MODE:local}
storage.local.base-dir=${STORAGE_LOCAL_BASE_DIR:/tmp/screening-local}

# SFTP Configuration (only used when storage.mode=sftp)
sftp.host=${SFTP_HOST:localhost}
sftp.port=${SFTP_PORT:22}
sftp.user=${SFTP_USER:user}
sftp.password=${SFTP_PASSWORD:password}

# Mass Screening — batch size and input polling
batch.size=${BATCH_SIZE:1000}
# Set to true to retain XML, checksum, zip, and CSV temp files after upload (useful for debugging)
batch.keep-temp-files=${BATCH_KEEP_TEMP_FILES:true}
batch.persist-clients=${BATCH_PERSIST_CLIENTS:false}
batch.input.sftp.dir=${BATCH_INPUT_SFTP_DIR:batch/input}
batch.input.processing.dir=${BATCH_INPUT_PROCESSING_DIR:batch/input/processing}
batch.input.failed.dir=${BATCH_INPUT_FAILED_DIR:batch/input/failed}
batch.input.ack.dir=${BATCH_INPUT_ACK_DIR:batch/output/ack}
batch.poller.interval=${BATCH_POLLER_INTERVAL_MS:30000}
batch.ingestion.chunk.size=${BATCH_INGESTION_CHUNK_SIZE:5000}

# NRTS API Configuration
nrts.base-url=${NRTS_BASE_URL:http://localhost:9090}
nrts.src-id=${NRTS_SRC_ID:2234}
nrts.username=${NRTS_USERNAME:nrts-service-account}
nrts.password=${NRTS_PASSWORD:changeme}
nrts.status-check-delay-ms=${NRTS_STATUS_CHECK_DELAY_MS:0}
nrts.http-timeout-ms=${NRTS_HTTP_TIMEOUT_MS:30000}
# true = MockScreeningProvider, false = NrtsScreeningProvider (real NRTS)
nrts.mock=${NRTS_MOCK:true}
